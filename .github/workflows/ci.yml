name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:bench
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  eval:
    # Crawls all 50 DarkBench variants and fails if any detector scores below eval/baseline.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:bench
      - run: npx playwright install --with-deps chromium
      - run: npm run eval -- --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eval-runs
          path: runs/

  eval-agent:
    # The recipe agent finds the checkout path on all 50 variants by itself, then every recipe
    # it wrote is replayed. Fails if any detector score drops below eval/baseline-agent.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:bench
      - run: npx playwright install --with-deps chromium
      - run: npm run eval -- --agent --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eval-agent-runs
          path: runs/

  docker:
    # The container is the one way to run DarkScan without Node, a browser or Ollama on the host,
    # so the image is built and actually exercised: unit tests, then a crawl of the bench service.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build both images
        run: docker compose build
      - name: Unit tests inside the tools image
        run: docker compose run --rm tools npm test
      - name: Crawl the bench service, scoring a dev and a held-out variant
        run: docker compose run --rm tools npm run eval -- --variants 0,1,25
      - name: Stop the bench
        if: always()
        run: docker compose down -v
